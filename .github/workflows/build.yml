name: Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Display Java version
        run: java -version

      - name: Build JAR
        run: make jar

      - name: Verify JAR was created
        run: |
          test -f dist/HeatSim.jar
          echo "JAR file size: $(du -h dist/HeatSim.jar | cut -f1)"

      - name: List JAR contents
        run: jar tf dist/HeatSim.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeatSim-jar
          path: dist/HeatSim.jar
          retention-days: 7
